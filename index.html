<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

    :root {
      --bg: #050a05;
      --grid: #0a150a;
      --snake-head: #00ff41;
      --snake-body: #00cc33;
      --food: #ff3c3c;
      --food-glow: #ff000088;
      --text: #00ff41;
      --dim: #1a3a1a;
      --border: #00ff4155;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Share Tech Mono', monospace;
      color: var(--text);
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,255,65,0.015) 2px,
        rgba(0,255,65,0.015) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 2.2rem;
      letter-spacing: 0.25em;
      color: var(--snake-head);
      text-shadow: 0 0 20px #00ff41, 0 0 40px #00ff4166;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .hud {
      display: flex;
      gap: 40px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      color: var(--dim);
    }

    .hud span { color: var(--text); }
    .hud label { color: #3a6a3a; }

    #game-wrapper {
      position: relative;
    }

    canvas {
      display: block;
      border: 1px solid var(--border);
      box-shadow:
        0 0 0 1px #00ff4111,
        0 0 30px #00ff4118,
        0 0 80px #00ff4108,
        inset 0 0 60px #00000099;
      background: var(--grid);
      image-rendering: pixelated;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5,10,5,0.88);
      backdrop-filter: blur(2px);
    }

    #overlay h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      margin-bottom: 10px;
      color: var(--snake-head);
      text-shadow: 0 0 16px #00ff41;
    }

    #overlay p {
      color: #3a6a3a;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      margin-bottom: 28px;
    }

    #overlay .final-score {
      font-size: 1rem;
      color: var(--text);
      margin-bottom: 24px;
      letter-spacing: 0.1em;
    }

    button {
      font-family: 'Share Tech Mono', monospace;
      background: transparent;
      color: var(--snake-head);
      border: 1px solid var(--snake-head);
      padding: 10px 36px;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 0 10px #00ff4133;
    }

    button:hover {
      background: #00ff4115;
      box-shadow: 0 0 20px #00ff4166;
    }

    .controls {
      margin-top: 16px;
      font-size: 0.7rem;
      color: #1a3a1a;
      letter-spacing: 0.1em;
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>
<body>

<h1>Snake</h1>

<div class="hud">
  <div><label>SCORE </label><span id="score">000</span></div>
  <div><label>BEST &nbsp;</label><span id="best">000</span></div>
  <div><label>LEVEL </label><span id="level">1</span></div>
</div>

<div id="game-wrapper">
  <canvas id="c" width="400" height="400"></canvas>
  <div id="overlay">
    <h2 id="overlay-title">SNAKE</h2>
    <p id="overlay-sub">PRESS START TO PLAY</p>
    <div id="final-score-wrap" class="final-score" style="display:none"></div>
    <button id="btn">START</button>
  </div>
</div>

<div class="controls">
  WASD / ARROW KEYS — MOVE &nbsp;|&nbsp; P — PAUSE
</div>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlaySub = document.getElementById('overlay-sub');
  const finalScoreWrap = document.getElementById('final-score-wrap');
  const btn = document.getElementById('btn');

  const COLS = 20, ROWS = 20;
  const CELL = canvas.width / COLS;

  let snake, dir, nextDir, food, score, best, level, running, paused, loopId, frameCount;

  best = parseInt(localStorage.getItem('snake_best') || '0');
  bestEl.textContent = String(best).padStart(3, '0');

  function init() {
    snake = [
      { x: 10, y: 10 },
      { x: 9,  y: 10 },
      { x: 8,  y: 10 },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    level = 1;
    frameCount = 0;
    paused = false;
    placeFood();
    updateHUD();
  }

  function placeFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function speed() {
    return Math.max(4, 10 - Math.floor(score / 50));
  }

  function updateHUD() {
    scoreEl.textContent = String(score).padStart(3, '0');
    bestEl.textContent = String(best).padStart(3, '0');
    levelEl.textContent = level;
  }

  function gameLoop() {
    if (!running || paused) return;
    frameCount++;
    if (frameCount % speed() !== 0) {
      loopId = requestAnimationFrame(gameLoop);
      return;
    }

    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver();
    }
    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      if (score > best) { best = score; localStorage.setItem('snake_best', best); }
      level = Math.floor(score / 50) + 1;
      updateHUD();
      placeFood();
    } else {
      snake.pop();
    }

    draw();
    loopId = requestAnimationFrame(gameLoop);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    drawFood();
    drawSnake();
  }

  function drawGrid() {
    ctx.strokeStyle = '#0d1a0d';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
    }
  }

  function drawFood() {
    const x = food.x * CELL, y = food.y * CELL;
    const cx = x + CELL / 2, cy = y + CELL / 2;
    const r = CELL / 2 - 3;
    const pulse = 0.85 + 0.15 * Math.sin(frameCount * 0.15);

    ctx.save();
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 14 * pulse;
    ctx.fillStyle = `hsl(${0 + Math.sin(frameCount * 0.05) * 10}, 100%, 55%)`;
    ctx.beginPath();
    ctx.arc(cx, cy, r * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Shine dot
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(cx - r * 0.28, cy - r * 0.28, r * 0.2, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSnake() {
    snake.forEach((seg, i) => {
      const x = seg.x * CELL + 1, y = seg.y * CELL + 1;
      const w = CELL - 2, h = CELL - 2;
      const alpha = i === 0 ? 1 : Math.max(0.35, 1 - i * 0.03);
      const green = i === 0 ? '#00ff41' : `hsl(${130 - i * 0.8}, 100%, ${45 - i * 0.5}%)`;

      ctx.save();
      if (i === 0) {
        ctx.shadowColor = '#00ff41';
        ctx.shadowBlur = 12;
      }
      ctx.globalAlpha = alpha;
      ctx.fillStyle = green;
      ctx.fillRect(x, y, w, h);

      // Head eyes
      if (i === 0) {
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#000';
        const ex1 = x + w * 0.25, ex2 = x + w * 0.65, ey = y + h * 0.3;
        if (dir.x !== 0) {
          const eyX = dir.x > 0 ? x + w * 0.55 : x + w * 0.05;
          ctx.beginPath(); ctx.arc(eyX + 3, y + h * 0.3, 2.5, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(eyX + 3, y + h * 0.7, 2.5, 0, Math.PI * 2); ctx.fill();
        } else {
          const eyY = dir.y > 0 ? y + h * 0.55 : y + h * 0.05;
          ctx.beginPath(); ctx.arc(x + w * 0.3, eyY + 3, 2.5, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(x + w * 0.7, eyY + 3, 2.5, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.restore();
    });
  }

  function gameOver() {
    running = false;
    cancelAnimationFrame(loopId);
    overlayTitle.textContent = 'GAME OVER';
    overlaySub.textContent = '';
    finalScoreWrap.style.display = 'block';
    finalScoreWrap.textContent = `SCORE: ${score}  |  BEST: ${best}`;
    btn.textContent = 'RETRY';
    overlay.style.display = 'flex';
  }

  function startGame() {
    overlay.style.display = 'none';
    finalScoreWrap.style.display = 'none';
    init();
    running = true;
    loopId = requestAnimationFrame(gameLoop);
  }

  btn.addEventListener('click', startGame);

  document.addEventListener('keydown', e => {
    const key = e.key;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','p'].includes(key)) {
      e.preventDefault();
    }

    if (key === 'p' || key === 'P') {
      if (!running) return;
      paused = !paused;
      if (!paused) loopId = requestAnimationFrame(gameLoop);
      return;
    }

    const map = {
      ArrowUp:    { x:  0, y: -1 },
      ArrowDown:  { x:  0, y:  1 },
      ArrowLeft:  { x: -1, y:  0 },
      ArrowRight: { x:  1, y:  0 },
      w: { x:  0, y: -1 },
      s: { x:  0, y:  1 },
      a: { x: -1, y:  0 },
      d: { x:  1, y:  0 },
    };
    const nd = map[key];
    if (!nd) return;
    if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
  });

  // Initial draw
  draw();
</script>
</body>
</html>
